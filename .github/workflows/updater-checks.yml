name: Updater checks
on:
  workflow_dispatch:
  push:
    branches: ['codex/launcher-auto-update']
  pull_request:
    paths: ['launcher/**', 'tests/Updater*/**', 'Directory.Build.props', '.github/workflows/updater-checks.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: UpdaterFixture.exe
          - os: macos-14
            rid: osx-arm64
            exe: UpdaterFixture
          - os: ubuntu-latest
            rid: linux-x64
            exe: UpdaterFixture
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/UpdaterChecks -c Release
      - run: dotnet publish tests/UpdaterProcessChecks -c Release -r ${{ matrix.rid }} --self-contained true -o native-fixture
      - shell: bash
        run: ./native-fixture/${{ matrix.exe }} --suite
